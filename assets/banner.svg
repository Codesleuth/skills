<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Codesleuth skills — agent skills for Claude Code">
  <title>Codesleuth skills</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c2e"/>
      <stop offset="1" stop-color="#080e1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffab86"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="260" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="19.5" fill="none" stroke="#25324a"/>

  <g fill="none" stroke="url(#accent)" stroke-opacity="0.3" stroke-width="2">
    <circle cx="1046" cy="130" r="56"/>
    <circle cx="1046" cy="130" r="90"/>
    <circle cx="1046" cy="130" r="124"/>
  </g>

  <g stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="128" cy="112" r="44"/>
    <path d="M159 143 L188 172"/>
    <path d="M122 96 L106 112 L122 128"/>
    <path d="M138 96 L154 112 L138 128"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="236" y="118" font-size="56" font-weight="700" fill="#e9eff8">Codesleuth<tspan fill="url(#accent)"> skills</tspan></text>
    <text x="236" y="157" font-size="23" fill="#8ea1bb">Agent skills for Claude Code, one folder each</text>
  </g>

  <rect x="236" y="180" width="96" height="5" rx="2.5" fill="url(#accent)"/>
</svg>
